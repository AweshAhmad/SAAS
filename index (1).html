<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Master — Apna AI Journey Shuru Karo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1F;
    --bg-elevated:#12172B;
    --bg-card:#151B33;
    --accent-violet:#7C6FFF;
    --accent-violet-dim:#4B4494;
    --accent-amber:#FFB648;
    --accent-green:#35D399;
    --text-primary:#EDEEF7;
    --text-muted:#9498B3;
    --border:#232842;
    --font-display:'Space Grotesk',sans-serif;
    --font-body:'Inter',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text-primary);
    font-family:var(--font-body);
    line-height:1.6;
    min-height:100vh;
  }
  a{color:inherit;}

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 32px;
    border-bottom:1px solid var(--border);
    position:sticky; top:0; background:rgba(10,14,31,0.85);
    backdrop-filter:blur(10px);
    z-index:50;
  }
  .logo{
    font-family:var(--font-display); font-weight:700; font-size:19px;
    letter-spacing:0.02em; display:flex; align-items:center; gap:8px;
  }
  .logo-dot{width:9px;height:9px;border-radius:50%;background:var(--accent-violet); box-shadow:0 0 12px var(--accent-violet);}
  .progress-pill{
    font-family:var(--font-mono); font-size:12px; color:var(--text-muted);
    background:var(--bg-elevated); border:1px solid var(--border);
    padding:6px 14px; border-radius:100px; display:flex; align-items:center; gap:8px;
  }
  .progress-pill b{color:var(--accent-amber); font-weight:600;}

  /* ---------- Hero ---------- */
  .hero{ padding:56px 32px 20px; max-width:1100px; margin:0 auto; text-align:center;}
  .eyebrow{
    font-family:var(--font-mono); font-size:12px; color:var(--accent-violet);
    letter-spacing:0.14em; text-transform:uppercase; margin-bottom:14px;
  }
  .hero h1{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(28px,4.4vw,48px); line-height:1.12; margin-bottom:16px;
  }
  .hero h1 span{ color:var(--accent-amber); }
  .hero p{ color:var(--text-muted); max-width:560px; margin:0 auto; font-size:15.5px;}

  /* ---------- Roadmap path ---------- */
  .roadmap-wrap{ max-width:1100px; margin:44px auto 8px; padding:0 20px; }
  .roadmap{ position:relative; width:100%; padding-top:24.2%; }
  .roadmap svg{ position:absolute; inset:0; width:100%; height:100%; }
  .road-path{
    fill:none; stroke:var(--border); stroke-width:3; stroke-dasharray:2 10; stroke-linecap:round;
  }
  .road-path.filled{ stroke:var(--accent-violet); stroke-dasharray:none; opacity:0.55; }
  .node{
    position:absolute; transform:translate(-50%,-50%);
    width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:600; font-size:14px;
    background:var(--bg-elevated); border:2px solid var(--border);
    color:var(--text-muted); cursor:pointer;
    transition:all .25s ease;
  }
  .node:hover{ border-color:var(--accent-violet); color:var(--text-primary); transform:translate(-50%,-50%) scale(1.08);}
  .node.active{ border-color:var(--accent-amber); color:var(--accent-amber); box-shadow:0 0 0 4px rgba(255,182,72,0.12);}
  .node.done{ background:var(--accent-green); border-color:var(--accent-green); color:#04261a;}
  .node.done::after{ content:'✓'; }
  .node-label{
    position:absolute; top:calc(100% + 6px); left:50%; transform:translateX(-50%);
    font-size:10.5px; color:var(--text-muted); white-space:nowrap; text-align:center; max-width:110px;
  }

  /* ---------- Main layout ---------- */
  .main{
    max-width:1100px; margin:64px auto 80px; padding:0 20px;
    display:grid; grid-template-columns:280px 1fr; gap:28px;
  }
  @media(max-width:800px){ .main{ grid-template-columns:1fr; } }

  .sidebar{
    background:var(--bg-card); border:1px solid var(--border); border-radius:14px;
    padding:10px; align-self:start; position:sticky; top:80px; max-height:calc(100vh - 100px); overflow-y:auto;
  }
  .module-item{ border-bottom:1px solid var(--border); }
  .module-item:last-child{ border-bottom:none; }
  .module-head{
    display:flex; align-items:center; gap:10px; padding:13px 10px; cursor:pointer;
    font-family:var(--font-display); font-weight:600; font-size:13.5px;
  }
  .module-head:hover{ color:var(--accent-amber); }
  .module-num{
    font-family:var(--font-mono); font-size:11px; color:var(--accent-violet);
    background:rgba(124,111,255,0.1); border-radius:6px; padding:2px 6px; flex-shrink:0;
  }
  .lesson-list{ display:none; padding:0 10px 10px 40px; }
  .lesson-list.open{ display:block; }
  .lesson-row{
    display:flex; align-items:center; gap:8px; padding:8px 6px; border-radius:8px;
    font-size:13px; color:var(--text-muted); cursor:pointer;
  }
  .lesson-row:hover{ background:rgba(124,111,255,0.08); color:var(--text-primary); }
  .lesson-row.active{ background:rgba(255,182,72,0.1); color:var(--accent-amber); }
  .lesson-dot{ width:6px; height:6px; border-radius:50%; background:var(--border); flex-shrink:0; }
  .lesson-row.completed .lesson-dot{ background:var(--accent-green); }

  /* ---------- Content panel ---------- */
  .panel{
    background:var(--bg-card); border:1px solid var(--border); border-radius:16px;
    padding:38px 40px;
  }
  @media(max-width:600px){ .panel{ padding:26px 20px; } }
  .panel-meta{
    display:flex; gap:10px; align-items:center; margin-bottom:14px;
    font-family:var(--font-mono); font-size:11.5px; color:var(--text-muted);
  }
  .tag{ padding:3px 9px; border-radius:100px; border:1px solid var(--border); }
  .tag.video{ color:var(--accent-amber); border-color:rgba(255,182,72,0.3); }
  .tag.text{ color:var(--accent-violet); border-color:rgba(124,111,255,0.3); }
  .panel h2{
    font-family:var(--font-display); font-size:26px; font-weight:700; margin-bottom:18px; line-height:1.3;
  }
  .video-box{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px;
    aspect-ratio:16/9; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; margin-bottom:22px; color:var(--text-muted);
  }
  .play-btn{
    width:56px; height:56px; border-radius:50%; background:var(--accent-violet);
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px;
  }
  .video-box small{ font-family:var(--font-mono); font-size:11.5px; }
  .lesson-body p{ color:#C7CADB; font-size:15px; margin-bottom:14px; }
  .lesson-body p:last-child{ margin-bottom:0; }
  .panel-footer{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:30px; padding-top:22px; border-top:1px solid var(--border);
  }
  .btn{
    font-family:var(--font-body); font-weight:600; font-size:13.5px;
    padding:10px 20px; border-radius:10px; border:1px solid var(--border);
    background:transparent; color:var(--text-muted); cursor:pointer; transition:all .2s;
  }
  .btn:hover{ border-color:var(--accent-violet); color:var(--text-primary); }
  .btn.primary{ background:var(--accent-violet); color:#fff; border-color:var(--accent-violet); }
  .btn.primary:hover{ background:#6a5cf0; }
  .btn.done{ background:var(--accent-green); border-color:var(--accent-green); color:#04261a; }

  footer{ text-align:center; padding:26px; color:var(--text-muted); font-size:12px; font-family:var(--font-mono); }
</style>
</head>

<div class="topbar">

            "Mock interviews practice karo aur apne projects ko 2-minute mein explain karna seekho — ye sabse zyada asked skill hai."]},

let activeLessonId = DATA[0].lessons[0].id;
let openModuleId = DATA[0].id;
let completed = {};

async function loadProgress(){
  try{
    const res = await window.storage.get('ai-master-progress');
    if(res && res.value) completed = JSON.parse(res.value);
  }catch(e){ completed = {}; }
  render();
}
async function saveProgress(){
  try{ await window.storage.set('ai-master-progress', JSON.stringify(completed)); }catch(e){}
}

function findLesson(id){
  for(const m of DATA) for(const l of m.lessons) if(l.id===id) return {module:m, lesson:l};
}
function moduleStatus(m){
  const done = m.lessons.every(l=>completed[l.id]);
  const started = m.lessons.some(l=>completed[l.id]);
  if(done) return 'done';
  if(m.id===openModuleId) return 'active';
  return started ? 'active' : 'todo';
}
function totalProgress(){
  const all = DATA.flatMap(m=>m.lessons);
  const done = all.filter(l=>completed[l.id]).length;
  return Math.round((done/all.length)*100);
}

function renderRoadmap(){
  const xs=[60,186,312,438,564,690,816,940], ys=[170,50,170,50,170,50,170,50];
  let pathD = `M${xs[0]},${ys[0]}`;
  for(let i=1;i<xs.length;i++) pathD += ` L${xs[i]},${ys[i]}`;
  let nodesHtml = '';
  DATA.forEach((m,i)=>{
    const status = moduleStatus(m);
    nodesHtml += `<div class="node ${status}" style="left:${xs[i]/10}%; top:${ys[i]/220*100}%;" data-mod="${m.id}">${status==='done'?'':i+1}<div class="node-label">${m.title}</div></div>`;
  });
  document.getElementById('roadmap').innerHTML = `
    <svg viewBox="0 0 1000 220" preserveAspectRatio="none">
      <path class="road-path" d="${pathD}"></path>
    </svg>
    ${nodesHtml}
  `;
  document.querySelectorAll('.node').forEach(n=>{
    n.addEventListener('click', ()=>{
      const mod = DATA.find(m=>m.id===n.dataset.mod);
      openModuleId = mod.id;
      activeLessonId = mod.lessons[0].id;
      render();
      document.getElementById('panel').scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = DATA.map((m,i)=>{
    const isOpen = m.id===openModuleId;
    return `
    <div class="module-item">
      <div class="module-head" data-mod="${m.id}">
        <span class="module-num">${String(i+1).padStart(2,'0')}</span> ${m.title}
      </div>
      <div class="lesson-list ${isOpen?'open':''}" data-list="${m.id}">
        ${m.lessons.map(l=>`
          <div class="lesson-row ${l.id===activeLessonId?'active':''} ${completed[l.id]?'completed':''}" data-lesson="${l.id}">
            <span class="lesson-dot"></span> ${l.title}
          </div>`).join('')}
      </div>
    </div>`;
  }).join('');

  sb.querySelectorAll('.module-head').forEach(h=>{
    h.addEventListener('click', ()=>{
      openModuleId = openModuleId===h.dataset.mod ? null : h.dataset.mod;
      render();
    });
  });
  sb.querySelectorAll('.lesson-row').forEach(r=>{
    r.addEventListener('click', ()=>{
      activeLessonId = r.dataset.lesson;
      render();
    });
  });
}

function renderPanel(){
  const {module, lesson} = findLesson(activeLessonId);
  const isDone = !!completed[lesson.id];
  const videoBlock = lesson.type==='video' ? `
    <div class="video-box">
      <div class="play-btn">▶</div>
      <small>VIDEO LESSON · ${lesson.title}</small>
    </div>` : '';

  document.getElementById('panel').innerHTML = `
    <div class="panel-meta">
      <span class="tag ${lesson.type}">${lesson.type==='video'?'🎥 Video':'📄 Text'}</span>
      <span>${module.title}</span>
    </div>
    <h2>${lesson.title}</h2>
    ${videoBlock}
    <div class="lesson-body">${lesson.body.map(p=>`<p>${p}</p>`).join('')}</div>
    <div class="panel-footer">
      <button class="btn" id="prevBtn">← Pichla</button>
      <button class="btn ${isDone?'done':'primary'}" id="completeBtn">${isDone?'✓ Complete kiya':'Mark as Complete'}</button>
      <button class="btn" id="nextBtn">Agla →</button>
    </div>
  `;

  document.getElementById('completeBtn').addEventListener('click', ()=>{
    completed[lesson.id] = !completed[lesson.id];
    saveProgress();
    render();
  });

  const allLessons = DATA.flatMap(m=>m.lessons);
  const idx = allLessons.findIndex(l=>l.id===lesson.id);
  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(idx>0){ activeLessonId = allLessons[idx-1].id; openModuleId = findLesson(activeLessonId).module.id; render(); }
  });
  document.getElementById('nextBtn').addEventListener('click', ()=>{
    if(idx<allLessons.length-1){ activeLessonId = allLessons[idx+1].id; openModuleId = findLesson(activeLessonId).module.id; render(); }
  });
}

function render(){
  renderRoadmap();
  renderSidebar();
  renderPanel();
  document.getElementById('progressText').textContent = totalProgress() + '%';
}

loadProgress();
</script>
</body>
</html>
